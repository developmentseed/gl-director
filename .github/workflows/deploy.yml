name: Build and Deploy
on:
  push:
    branches:
      - main

env:
  NODE: 14

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@28c7f3d2b5162b5ddd3dfd9a45aa55eaf396478b # v2.3.1 
        with:
          persist-credentials: false
          
      - name: Use Node.js ${{ env.NODE }}
        uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1
        with:
          node-version: ${{ env.NODE }}

      - name: Install and Build 🔧 
        run: |
          yarn install
          yarn build
        env:
          BASEURL: https://developmentseed.org/gl-director

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@132898c54c57c7cc6b80eb3a89968de8fc283505 # 3.7.1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages
          FOLDER: dist 
          CLEAN: true
